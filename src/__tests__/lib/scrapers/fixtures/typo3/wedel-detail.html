<h1>Herbstaktion Zurück aufs Rad</h1>
<script type="application/ld+json">{"@context":"http:\/\/schema.org","@type":"Event","startDate":"2026-11-02T15:00:00","endDate":"2026-11-02T17:00:00","name":"Herbstaktion Zur\u00fcck aufs Rad","description":"Noch genie\u00dfen wir den sonnigen Herbst in Wedel. Hier kann man zwar&nbsp;vieles zu Fu\u00df erledigen, aber mit einem Fahrrad w\u00e4re man leichter unterwegs.&nbsp;Aber ich traue mich nicht so recht. ..Das kommt Ihnen bekannt vor? Zeit f\u00fcr unsere Herbstaktion&nbsp;Zur\u00fcck aufs Rad.\r\nIn Zusammenarbeit mit der Wedeler Ortsgruppe des ADFC l\u00e4dt der Senionenbeirat Sie ein, sich zu \u00fcberwinden und aktiv zu werden. Unser ehem. Seniorenbeirat J\u00fcrgen Lieske kl\u00e4rt und \u00fcbt&nbsp;mit Ihnen, was man tun kann, um wieder auf den Sattel zu kommen.&nbsp;Wenn Sie m\u00f6chten, finden Sie hier einen R\u00fcckblick auf den Kurs im Fr\u00fchjahr 2026.&nbsp;\r\nZur\u00fcck aufs Rad - \u201eaber ich&nbsp;traue mich nicht so recht\u201c\r\nWenn es Ihnen auch so geht, sind Sie hier richtig.&nbsp;Vielleicht haben Sie&nbsp; Gleichgewichtsprobleme, die das Rad fahren unm\u00f6glich erscheinen lassen? J\u00fcrgen zeigt Ihnen&nbsp;spezielle \u00dcbungen ohne&nbsp;&nbsp;Rad (!)&nbsp;&nbsp;und Sie \u00fcben gemeinsam, testen Ihr Gleichgewicht. Nach einigen gymnastischen \u00dcbungen, erfahren Sie ein Laufrad: Keine Pedale, kein Treten - und beide F\u00fc\u00dfe auf der Erde. Dabei entspannt im Sattel sitzen und den Lenker fest im Griff. Wir sind gespannt auf Ihre erste Runde im Elbestadion\u2026. Sie auch?\r\nDiesen Kurs \u201eAngstbew\u00e4ltigung\u201c hat J\u00fcrgen Lieske speziell f\u00fcr Senioren entwickelt und mit dem Seniorenbeirat abgestimmt.\r\nKosten: F\u00fcr Senioren kostenfrei. Die ADFC Radfahrschule Wedel freut sich jedoch \u00fcber&nbsp;Spenden f\u00fcr neues Equipment. Fahrrad mitbringen: Nicht n\u00f6tig in der ersten Stunde. Wer sich schon traut, kann es gerne mitbringen. Anmeldung: Bitte melden Sie sich unbedingt fr\u00fchzeitig an, da die Anzahl an passenden Laufr\u00e4dern begrenzt ist.&nbsp; Die Betreuung und Unterst\u00fctzung geht am besten bis etwa vier gleichzeitigen Teilnehmern.&nbsp;Anmelden bei J\u00fcrgen Lieske mobil: 0175 16 00 440 (auch Signal und Whatsapp). Oder per E-Mail an&nbsp; radfahrschule-wedel@adfc-sh.de.&nbsp;\r\nOder auch \u00fcber unser Kontaktformular.&nbsp;\r\nHinweis:&nbsp;Wer danach richtig Lust hat auf mehr - oder auch f\u00fcr Radler:innen ohne Angst, die einfach sicherer fahren m\u00f6chten, denen empfehlen wir im Anschluss ein Fahrsicherheitstraining.&nbsp;Im Herbst gibt es noch einen Kurstermin&nbsp;am Samstag, 24.10. 2026 um 14:00 Uhr im Elbestadion Bekstra\u00dfe.&nbsp;Info und Anmeldung unter 0176 64 88 53 49 beim Kursleiter&nbsp;Rainer Hagendorf.\r\nZur Person: J\u00fcrgen Lieske&nbsp;\r\nJ\u00fcrgen Lieske hat als Alltags-Radler in den letzten Jahrzehnten \u00fcber 100.000 km auf dem Rad verbracht. Er war von 2020 - 2024 Mitglied im Seniorenbeirat, Sohn einer gehbehinderten Mutter und hat 2 Jahre in der Behindertenbetreuung als Alltagsbegleiter gearbeitet.\r\nJ\u00fcrgen hat nach&nbsp;vielen Jahren im ADFC sowie als Sprecher der Ortsgruppe Wedel von 2014 - 2022 die ADFC Radfahrschule Wedel&nbsp;gegr\u00fcndet und seither viele Menschen, vorrangig Damen, erstmalig und im Rahmen der Angstbew\u00e4ltigung auf\u2019s Rad geholfen.\r\nAm&nbsp;meisten motiviert Ihn die Freude seiner Kunden schon nach den&nbsp;ersten Minuten auf dem Rad: Freiheit und Gl\u00fcck pur.","url":"https:\/\/www.wedel.de\/leben-in-wedel\/veranstaltungen\/veranstaltungsdetails\/2026-11-02_1500\/herbstaktion-zurueck-aufs-rad","location":{"@type":"Place","name":"Elbestadion","address":{"@type":"PostalAddress","streetAddress":"Bekstr. \/ Ecke Schulauer Str. 20 A","postalCode":"22880","addressLocality":"Wedel"}},"image":{"@type":"ImageObject","caption":null,"contentSize":482715,"contentUrl":"https:\/\/www.wedel.de\/fileadmin\/user_upload\/media\/pdf\/Leben_in_Wedel\/Senioren\/Seniorenbeirat\
