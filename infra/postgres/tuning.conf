# infra/postgres/tuning.conf — Hetzner CPX31 (4 vCPU AMD, 8 GB RAM, NVMe)
#
# Wird per include_if_exists nach der Supabase-Default-Config geladen und
# ueberschreibt sie. Siehe infra/docker-compose.override.yml (Service `db`).
#
# Ausgangslage: Supabase Micro hatte ~1 GB RAM bei 3,2 GB Datenbank. Daher die
# in MASTERPLAN §3.2 dokumentierten Ø 26,9 s auf der Top-Query und Ø 1,2 s pro
# Scrape-Insert — permanenter Buffer-Cache-Thrash.
#
# Auf 8 GB passt die KOMPLETTE Datenbank (3.207 MB, groesste Tabelle `events`
# mit 2.575 MB) in shared_buffers + OS-Page-Cache. Das ist der eigentliche
# Gewinn des Umzugs, nicht die Ersparnis.

# ---------------------------------------------------------------- Speicher
# 2 GB = 25 % von 8 GB, der Standard-Richtwert. Bewusst NICHT hoeher:
# Next.js, Realtime und die uebrigen Container brauchen den Rest, und der
# OS-Page-Cache haelt die restlichen ~1,2 GB der DB ohnehin warm.
shared_buffers = 2GB

# Was Postgres an insgesamt verfuegbarem Cache annehmen darf (shared_buffers
# + OS-Page-Cache). Beeinflusst nur die Planner-Kostenschaetzung, allokiert
# nichts. 5 GB ist fuer 8 GB Host mit ~3 GB Container-Overhead realistisch.
effective_cache_size = 5GB

# Pro Sort-/Hash-Operation, nicht pro Query. Bei max_connections=200 waere ein
# grosser Wert gefaehrlich (200 × work_mem × mehrere Ops pro Query). 16 MB ist
# fuer die Landing-/Karten-Queries ausreichend und bleibt im Worst Case zahm.
work_mem = 16MB

# Fuer VACUUM, CREATE INDEX und den initialen pg_restore. Grosszuegig, weil
# nur wenige Prozesse das gleichzeitig nutzen.
maintenance_work_mem = 512MB

# ------------------------------------------------------------ Verbindungen
# Next.js (1 Prozess) + PostgREST-Pool + GoTrue + Storage + Realtime +
# pg_cron + die GitHub-Actions-Scraper. 200 ist reichlich; jede Connection
# kostet Backend-RAM, deshalb nicht mehr.
max_connections = 200

# ---------------------------------------------------------------- Storage
# NVMe: Random-I/O ist so billig wie sequenzielles. Der Default (4.0) stammt
# aus der Drehscheiben-Aera und laesst den Planner Index-Scans meiden.
random_page_cost = 1.1
effective_io_concurrency = 200

# ------------------------------------------------------------------- WAL
# Groessere Checkpoint-Abstaende = weniger I/O-Spitzen waehrend der
# Scrape-Upserts (44k Inserts pro Lauf).
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# ------------------------------------------------------------- Parallelitaet
# 4 vCPU. Parallel Workers helfen den Aggregat-Queries (event_stats_cache,
# event_map_points MV-Refresh), duerfen aber nicht alle Kerne belegen,
# waehrend Next.js rendert.
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------- Autovacuum
# `events` bekommt taeglich 44k Upserts. Der Default-Scale-Factor (0.2) heisst
# bei ~300k Zeilen: erst nach 60k toten Tupeln. Aggressiver vacuumen haelt die
# Tabelle kompakt und die Statistiken frisch.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ------------------------------------------------------------------ Timeouts
# Supabase Cloud hatte harte Statement-Timeouts, die laut CLAUDE.md regelmaessig
# zugeschlagen haben (count(*) exact auf events). Wir setzen einen eigenen,
# grosszuegigeren Deckel: lieber eine Query abbrechen als den Host blockieren.
statement_timeout = 120s
idle_in_transaction_session_timeout = 300s
lock_timeout = 30s

# --------------------------------------------------------------- Extensions
# pg_cron muss in shared_preload_libraries, sonst starten die 6 Jobs nicht.
# pg_stat_statements ist die Diagnose-Grundlage fuer MASTERPLAN §3.2.
shared_preload_libraries = 'pg_stat_statements,pg_cron'
cron.database_name = 'postgres'

# ---------------------------------------------------------------- Logging
# Alles ueber 1 s wird geloggt. Nach dem Umzug sollte diese Liste fast leer
# sein — genau das ist das Abnahmekriterium fuer den Performance-Teil.
log_min_duration_statement = 1000
log_checkpoints = on
log_autovacuum_min_duration = 5000
log_line_prefix = '%m [%p] %q%u@%d '
