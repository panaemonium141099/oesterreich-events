<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · LassTreffen.at</title>
    <!--
      fn-15.10 round-3 (codex): inline <style> moved to /offline.css so it
      passes the fn-15.6 stricter style-src CSP without needing a second
      whitelisted hash. The CSS file is same-origin under /public so the
      `style-src 'self'` clause covers it.
    -->
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="badge"><span class="dot"></span>Offline</span>
        <h1>Du bist offline</h1>
        <p>
          Wir können gerade keine Verbindung zu LassTreffen aufbauen. Sobald du wieder
          Empfang hast, geht's weiter.
        </p>
        <button class="btn" type="button" onclick="location.reload()">
          Erneut versuchen
        </button>
        <div class="hint">Tipp: WLAN oder Mobilfunk prüfen.</div>
      </div>
    </div>
  </body>
</html>
