<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · LassTreffen.at</title>
    <style>
      /*
       * fn-15.10 — offline fallback. Served by the Service Worker when a
       * top-level navigation can't reach the network. Inline styles only
       * (no external CSS) because the SW caches this single document and
       * we want zero extra requests. The look matches the landing's hero
       * palette (--color-bg=#0a0a0c, foreground=#f1f5f9) so the failure
       * mode still feels on-brand.
       */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0c;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Helvetica Neue', sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.75rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 1.25rem;
        color: #94a3b8;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #ef4444;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.875rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 1rem;
        line-height: 1.55;
        color: #cbd5e1;
      }
      .btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #f1f5f9;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.9375rem;
        cursor: pointer;
        font: inherit;
        font-weight: 500;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="badge"><span class="dot"></span>Offline</span>
        <h1>Du bist offline</h1>
        <p>
          Wir können gerade keine Verbindung zu LassTreffen aufbauen. Sobald du wieder
          Empfang hast, geht's weiter.
        </p>
        <button class="btn" type="button" onclick="location.reload()">
          Erneut versuchen
        </button>
        <div class="hint">Tipp: WLAN oder Mobilfunk prüfen.</div>
      </div>
    </div>
  </body>
</html>
