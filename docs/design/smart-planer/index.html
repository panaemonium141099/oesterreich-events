<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart-Suche Mockups</title>
<meta name="description" content="Drei Gestaltungsvarianten für die Smart-Suche auf lasstreffen.at/entdecken: Freitext bleibt, die Antwort wird visuell.">
<style>
:root{--bg:#0a0a0c;--ink:#fff;--muted:rgba(255,255,255,.55);--line:rgba(255,255,255,.1)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0a0a0c}}
:root[data-theme="dark"]{--bg:#0a0a0c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar b{font-size:14px;margin-right:10px}
.bar button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer}
.bar button.on{background:#fff;color:#0a0a0c;border-color:#fff}
.bar .vp{margin-left:auto;display:flex;gap:6px}
.bar p{width:100%;margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.stage{height:calc(100% - 92px);display:flex;justify-content:center;background:#000}
iframe{border:0;width:100%;height:100%;background:#0a0a0c}
iframe.m{width:390px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
</style></head><body>
<div class="bar"><b>Smart-Suche: Varianten</b>
<button class="on" data-v="a-composer">A · Freitext + Regale</button><button data-v="b-karte">B · Freitext + Karte</button><button data-v="c-flow">C · Chat bleibt, Antworten als Regale</button>
<div class="vp"><button class="on" data-w="d">Desktop</button><button data-w="m">Handy</button></div>
<p id="note"></p></div>
<div class="stage"><iframe id="f" src="a-composer.html" title="Variante"></iframe></div>
<script>
const notes={'a-composer':'Freitext ist die Bühne: ein großes Feld „Sag einfach, was du vorhast", Beispielsätze zum Antippen, optional Standort/Zeit-Chips als Ergänzung. Die Antwort: Verstanden-Chips (abwählbar), ein Concierge-Satz, dann Poster-Regale nach Abendphase (Vorglühen, Partys unter 15 €, nach Mitternacht). Rechts die Timeline „Dein Abend" mit Öffi-Minuten und Eintritt gesamt, am Handy als Bottom-Bar.','b-karte':'Dieselbe Freitext-Zeile, kompakt, mit Verstanden-Chips darunter. Treffer links nummeriert, rechts die Karte mit Standort, Pins und gestrichelter Route der Auswahl. Unten die Abend-Zeitachse 18 bis 4 Uhr. Zeigt „was liegt nah beieinander", was für einen Abend mit mehreren Stopps zählt.','c-flow':'Die kleinste Änderung zum heutigen Stand: der Chat bleibt, aber jede Antwort ist ein kurzer Satz plus Regale mit Karten statt Prosa. Nachfragen als Chips, die aus der Antwort entstehen („Nur gratis", „Eher am Gürtel"), Freitext jederzeit. Während der Suche kommen Skeleton-Karten und ein Status statt eines blinkenden Cursors. Die Auswahl klebt als Leiste über dem Eingabefeld.'};
const f=document.getElementById('f'),note=document.getElementById('note');let v='a-composer',w='d';
function go(){f.src=v+'.html';f.className=w==='m'?'m':'';note.textContent=notes[v];document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===w));}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;go()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=b.dataset.w;go()});go();
</script></body></html>
