name: deploy

# fn-20: Push auf master -> Hetzner-Server baut und startet die App neu.
# Ersetzt das Vercel-Auto-Deploy. deploy.sh liegt auf dem Server
# (/opt/app/deploy.sh): git reset auf origin/master, docker compose build/up.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Kein Deploy mit roten Tests (Wächter für Ortsdaten, Taxonomie, Kodierung …).
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new root@157.180.42.4 '/opt/app/deploy.sh'

      # Die Startseite wird beim Build vorgerendert; scheitert dort eine
      # Abfrage am statement_timeout (Build rendert hunderte Seiten
      # parallel), bleibt die Sektion still leer und Next cacht die Seite
      # eine Stunde (Saison-Karte leer: 2026-09-25 und 2026-11-04, nur /de).
      # Deshalb nach dem Health-Gate einmal `revalidateLanding()` (curl auf
      # /api/cron/revalidate-landing mit Bearer CRON_SECRET aus der Runtime-
      # Env, wie der Timer um 00:05) und beide Sprachfassungen abrufen, damit
      # der frische Render jetzt passiert und nicht erst beim ersten Besucher.
      # Die Zahl der Saison-Picks steht im Log; sie ist kein Gate, weil eine
      # Saison legitim leer sein kann.
      - name: Startseite nach dem Build neu rendern
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@157.180.42.4 '
            set -eu
            secret=$(sed -n "s/^CRON_SECRET=//p" /opt/app/.env.master | tr -d "\r\"\047")
            curl -fsS -H "Authorization: Bearer $secret" http://127.0.0.1:3000/api/cron/revalidate-landing
            echo
            for path in / /en; do
              for i in 1 2; do
                html=$(curl -sS -H "Host: lasstreffen.at" -H "User-Agent: lt-deploy-warm" "http://127.0.0.1:3000$path")
              done
              echo "$path: $(printf "%s" "$html" | grep -o "season-pick-title" | wc -l) Saison-Picks, $(printf "%s" "$html" | grep -o "landing_tip_click" | wc -l) Tipp"
            done
          '
