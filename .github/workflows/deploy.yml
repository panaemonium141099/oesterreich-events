name: deploy

# fn-20: Push auf master -> Hetzner-Server baut und startet die App neu.
# Ersetzt das Vercel-Auto-Deploy. deploy.sh liegt auf dem Server
# (/opt/app/deploy.sh): git reset auf origin/master, docker compose build/up.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new root@157.180.42.4 '/opt/app/deploy.sh'
