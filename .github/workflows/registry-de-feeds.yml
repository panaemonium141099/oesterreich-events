# Feeds der DE-Gemeinde-Registry bestätigen (fn-29.4), von dort aus, wo auch
# der Nachtlauf liest: Websites, die Rechenzentren sperren, zählen so nicht als
# lesbar, und Server, die von lokal nicht antworten (ekom21 80.69.201.211),
# werden wirklich geprüft.
#
# Nur lesende GETs, robots.txt je Website, je Server nacheinander mit Pause.
# Schreibt nichts in die Datenbank und nichts ins Repo: Ergebnis ist das
# Artefakt (data/de-gemeinde-registry.json, Gründe je Seite). Übernahme von
# Hand als PR, den Diff der Registry wie einen Adapter-Wechsel prüfen.

name: Registry DE Feeds bestätigen

on:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration der Registry'
        required: true
        default: 'ionas'
      workers:
        description: 'Server gleichzeitig'
        required: false
        default: '8'

concurrency:
  group: registry-de-feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Feeds bestätigen
        run: npx tsx src/scripts/build-de-registry.ts --feeds --only "${{ github.event.inputs.integration }}" --workers "${{ github.event.inputs.workers }}" | tee feed-lauf.txt
      - name: Ergebnis in die Zusammenfassung
        if: always()
        run: |
          { echo '```'; tail -n 40 feed-lauf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-de-feeds
          include-hidden-files: true
          path: |
            data/de-gemeinde-registry.json
            .registry-cache/feeds-log.json
            .registry-cache/feeds-v3.json
            feed-lauf.txt
          retention-days: 30
