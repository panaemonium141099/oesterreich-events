# Blog-Autowriter (fn-19): schreibt täglich 1-2 SEO-Blogposts zu aktuellen
# Events/Festivals und pusht sie direkt auf master (User-Entscheidung
# 2026-08-26: vollautomatische Publikation). Vercel deployt den Push,
# sitemap-core.xml zieht die neuen Posts automatisch aus ALL_POSTS.
#
# Recherche + Text: `claude -p` (Claude Code CLI) ueber das Claude-Abo des
# Betreibers, seit 2026-09-13 statt Gemini. Auth ist ein einjaehriges Token
# aus `claude setup-token` im Secret CLAUDE_CODE_OAUTH_TOKEN — kein
# API-Guthaben, kein Laptop. Harte Fakten kommen aus der Events-DB. Ohne
# brauchbares Hero-Bild wird kein Post publiziert — das Script failt laut,
# wenn gar kein Kandidat durchkommt (dann Log ansehen).

name: Blog Autowriter

on:
  schedule:
    # Zwei Slots pro Tag, weil `claude -p` ueber das Abo laeuft und sich das
    # 5-Stunden-Sitzungslimit mit der interaktiven Arbeit des Betreibers
    # teilt. GitHub feuert Cron-Jobs ausserdem gern 1-5 h verspaetet: der
    # fruehere 05:23-Slot lief real um 09:25 bis 10:45 UTC, mitten in der
    # Arbeitszeit, und scheiterte am Limit (Befund 2026-09-14).
    #   02:40 UTC (04:40 Wien): Nachtruhe, Fenster ist frei. Hauptslot.
    #   21:10 UTC (23:10 Wien): Rueckfall, falls der Morgen am Limit
    #   scheiterte. Der Guard unten verhindert doppelte Posts an einem Tag.
    - cron: '40 2 * * *'
    - cron: '10 21 * * *'
    # Sonntags 03:40 UTC zusätzlich EIN Unterkunfts-Guide (fn-21,
    # Rubrik "Übernachten", rotierende Topic-Liste im Script).
    - cron: '40 3 * * 0'
  workflow_dispatch:
    inputs:
      count:
        description: 'Anzahl Posts (Default 2)'
        required: false
        default: '2'
      stayguide:
        description: 'true = Unterkunfts-Guide statt Event-Posts'
        required: false
        default: 'false'

concurrency:
  group: blog-autowriter
  cancel-in-progress: false

permissions:
  contents: write
  # fn-21: der Post-Commit muss das Server-Deploy selbst anstossen —
  # Pushes mit dem GITHUB_TOKEN triggern keine anderen Workflows.
  actions: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Die CLI ist bewusst NICHT in package.json: sie ist ein Betriebs-
      # werkzeug dieses Jobs, kein Bestandteil der App. Immer die aktuelle
      # Version — --max-turns und --json-schema kamen erst mit 2.1.2xx.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code && claude --version

      # Guard: hat der Bot heute schon Event-Posts committet (Morgen-Slot
      # war erfolgreich), ist der Abend-Slot ein No-op. Nur fuer geplante
      # Laeufe — ein manueller Start soll immer schreiben.
      - name: Heute schon geschrieben?
        id: today
        if: github.event_name == 'schedule' && github.event.schedule != '40 3 * * 0'
        run: |
          git fetch --deepen=30 origin master >/dev/null 2>&1 || true
          # Stay-Guides (Slug "uebernachten-…") zaehlen nicht: die laufen sonntags
          # in einem eigenen Slot und sollen die Event-Posts nicht blockieren.
          if git log --since="$(date -u +%F)T00:00:00Z" --author="blog-autowriter" --grep="Autowriter" --oneline | grep -v "uebernachten-" | grep -q .; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Heute ist bereits ein Autowriter-Commit auf master — nichts zu tun."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write blog posts
        id: write
        if: github.event.schedule != '40 3 * * 0' && github.event.inputs.stayguide != 'true' && steps.today.outputs.done != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          npx tsx src/scripts/blog-autowriter.ts --count ${{ github.event.inputs.count || '2' }}
          code=$?
          # Exit 75 = Abo-Sitzungslimit. Kein Defekt, der naechste Slot
          # versucht es erneut — deshalb Warnung statt rotem Lauf.
          if [ "$code" = "75" ]; then
            echo "::warning::Abo-Sitzungslimit erreicht — der naechste Slot versucht es erneut."
            echo "ratelimited=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code

      - name: Write stay guide (fn-21)
        id: staywrite
        if: github.event.schedule == '40 3 * * 0' || github.event.inputs.stayguide == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          npx tsx src/scripts/blog-autowriter.ts --stay-guide
          code=$?
          if [ "$code" = "75" ]; then
            echo "::warning::Abo-Sitzungslimit erreicht — Unterkunfts-Guide faellt diese Woche aus."
            echo "ratelimited=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code

      - name: Commit & push
        if: steps.today.outputs.done != 'true' && steps.write.outputs.ratelimited != 'true' && steps.staywrite.outputs.ratelimited != 'true'
        run: |
          git config user.name "blog-autowriter[bot]"
          git config user.email "noreply@lasstreffen.at"
          git add src/content/blog public/images/blog
          if git diff --cached --quiet; then
            echo "Nichts zu committen — Script hätte failen müssen."
            exit 1
          fi
          git commit -m "content(blog): Autowriter $(date -u +%F) — ${{ steps.write.outputs.slugs || steps.staywrite.outputs.slugs }}"
          git push origin master

      # Pushes aus Workflows loesen keine push-Trigger aus (GitHub-Schutz
      # gegen Rekursion) — ohne diesen Schritt kaeme der neue Post nie live.
      - name: Deploy anstossen
        if: steps.today.outputs.done != 'true' && steps.write.outputs.ratelimited != 'true' && steps.staywrite.outputs.ratelimited != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
