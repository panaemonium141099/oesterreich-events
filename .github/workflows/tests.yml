name: tests

# Bis 2026-09-24 lief die Testsuite nirgends automatisch; 113 rote Tests
# sammelten sich unbemerkt an, darunter ein Classifier, der 39 % der Events
# in „Sonstiges" schob. Seitdem: Tests bei jedem PR und vor jedem Deploy
# (deploy.yml ruft diesen Workflow auf und wartet auf ihn).

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npx vitest run
      # fn-31: dieselbe Codebasis baut auch lasstreffen.de. Site, Wächter und
      # SEO-Helfer müssen mit beiden Ländern grün sein.
      - name: Vitest (SITE_COUNTRY=DE)
        env:
          SITE_COUNTRY: DE
        run: npx vitest run src/__tests__/lib/site.test.ts src/__tests__/lib/site-country-guard.test.ts src/__tests__/lib/domain-literal-guard.test.ts src/__tests__/lib/site-features.test.ts src/__tests__/i18n/site-messages.test.ts
