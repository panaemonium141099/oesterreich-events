name: Scrape Events Pipeline

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/Vienna
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Specific scraper to run (leave empty for all)'
        required: false
        default: ''
      skip_scrapers:
        description: 'Skip scrapers (only run post-processing: normalize, geocode, score, report)'
        required: false
        default: 'false'
        type: boolean
      skip_geocoding:
        description: 'Skip geocoding step'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run scrape pipeline
        run: |
          TRIGGER="cron"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="github_dispatch"
          fi
          ARGS="--trigger $TRIGGER"
          if [ -n "${{ github.event.inputs.scraper }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.scraper }}"
          fi
          if [ "${{ github.event.inputs.skip_scrapers }}" = "true" ]; then
            ARGS="$ARGS --skip-scrapers"
          fi
          if [ "${{ github.event.inputs.skip_geocoding }}" = "true" ]; then
            ARGS="$ARGS --skip-geocoding"
          fi
          npx tsx src/scripts/scrape-pipeline.ts $ARGS
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Generate scrape report
        if: success()
        run: npx tsx src/scripts/generate-scrape-report.ts || true

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Finalize if pipeline crashed (scoped to this run)
        if: always()
        run: npx tsx src/scripts/finalize-stale-runs.ts --github-run-id "$GITHUB_RUN_ID"
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
